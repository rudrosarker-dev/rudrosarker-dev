<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 215" width="100%" height="215">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#131419"/>
    </linearGradient>
    <style>
      .flow-line { stroke-dasharray: 10 8; animation: flowAnim 2.2s linear infinite; }
      @keyframes flowAnim { to { stroke-dashoffset: -36; } }
    </style>
  </defs>

  <rect x="2" y="2" width="916" height="211" rx="16" fill="url(#pipeBg)" stroke="#27272a" stroke-width="1.5"/>
  <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="800" fill="#f4f4f5">
    How I Take an Idea from Sketch to Live Product
  </text>

  <line x1="160" y1="122" x2="760" y2="122" stroke="#27272a" stroke-width="4"/>
  <line x1="160" y1="122" x2="760" y2="122" stroke="#eab308" stroke-width="2" class="flow-line"/>

  <g transform="translate(28, 58)">
    <rect x="0" y="7" width="196" height="120" rx="12" fill="#050507" stroke="#27272a"/>
    <rect x="0" y="0" width="196" height="120" rx="12" fill="#16171d" stroke="#3f3f46" stroke-width="1.2"/>
    <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#eab308">Step 1</text>
    <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15.5" font-weight="800" fill="#fafafa">Plan &amp; UI Layout</text>
    <text x="18" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#a1a1aa">Mapping out the pages,</text>
    <text x="18" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#a1a1aa">design, and user flow</text>
  </g>

  <g transform="translate(249, 58)">
    <rect x="0" y="7" width="196" height="120" rx="12" fill="#050507" stroke="#27272a"/>
    <rect x="0" y="0" width="196" height="120" rx="12" fill="#16171d" stroke="#3f3f46" stroke-width="1.2"/>
    <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#d4d4d8">Step 2</text>
    <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15.5" font-weight="800" fill="#fafafa">Code with AI &amp; TS</text>
    <text x="18" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#a1a1aa">Building fast with React,</text>
    <text x="18" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#a1a1aa">Next.js, and AI tools</text>
  </g>

  <g transform="translate(470, 58)">
    <rect x="0" y="7" width="196" height="120" rx="12" fill="#050507" stroke="#27272a"/>
    <rect x="0" y="0" width="196" height="120" rx="12" fill="#16171d" stroke="#3f3f46" stroke-width="1.2"/>
    <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#d4d4d8">Step 3</text>
    <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15.5" font-weight="800" fill="#fafafa">Database &amp; APIs</text>
    <text x="18" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#a1a1aa">Connecting Neon Postgres,</text>
    <text x="18" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#a1a1aa">auth, and AI features</text>
  </g>

  <g transform="translate(691, 58)">
    <rect x="0" y="7" width="199" height="120" rx="12" fill="#050507" stroke="#27272a"/>
    <rect x="0" y="0" width="199" height="120" rx="12" fill="#16171d" stroke="#52525b" stroke-width="1.2"/>
    <line x1="12" y1="1" x2="187" y2="1" stroke="#d4af37" stroke-width="1.5"/>
    <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#eab308">Step 4</text>
    <text x="18" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15.5" font-weight="800" fill="#fafafa">Ship &amp; Go Live</text>
    <text x="18" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#a1a1aa">Testing and deploying</text>
    <text x="18" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" fill="#a1a1aa">live to the web</text>
  </g>
