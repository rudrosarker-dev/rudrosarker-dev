<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 210" width="100%" height="210">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#131419"/>
    </linearGradient>
    <style>
      .flow-line { stroke-dasharray: 10 8; animation: flowAnim 2.2s linear infinite; }
      @keyframes flowAnim { to { stroke-dashoffset: -36; } }
    </style>
  </defs>

  <rect x="2" y="2" width="916" height="206" rx="16" fill="url(#pipeBg)" stroke="#27272a" stroke-width="1.5"/>
  <text x="34" y="36" font-family="'SF Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#eab308" letter-spacing="1.4">
    END-TO-END PRODUCT PIPELINE  //  FROM CONCEPT TO PRODUCTION DEPLOYMENT
  </text>

  <!-- Animated Connecting Gold Data Track -->
  <line x1="160" y1="118" x2="760" y2="118" stroke="#27272a" stroke-width="4"/>
  <line x1="160" y1="118" x2="760" y2="118" stroke="#eab308" stroke-width="2" class="flow-line"/>

  <!-- STAGE 1 -->
  <g transform="translate(28, 56)">
    <rect x="0" y="7" width="196" height="118" rx="12" fill="#050507" stroke="#27272a"/>
    <rect x="0" y="0" width="196" height="118" rx="12" fill="#16171d" stroke="#3f3f46" stroke-width="1.2"/>
    <text x="18" y="30" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="800" fill="#eab308">STAGE 01</text>
    <text x="18" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="800" fill="#fafafa">AI Architecture</text>
    <text x="18" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#a1a1aa">System design, UI specs</text>
    <text x="18" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#a1a1aa">&amp; structured prompts</text>
  </g>

  <!-- STAGE 2 -->
  <g transform="translate(249, 56)">
    <rect x="0" y="7" width="196" height="118" rx="12" fill="#050507" stroke="#27272a"/>
    <rect x="0" y="0" width="196" height="118" rx="12" fill="#16171d" stroke="#3f3f46" stroke-width="1.2"/>
    <text x="18" y="30" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="800" fill="#d4d4d8">STAGE 02</text>
    <text x="18" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="800" fill="#fafafa">TypeScript Build</text>
    <text x="18" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#a1a1aa">Modular React, Next.js</text>
    <text x="18" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#a1a1aa">&amp; clean component code</text>
  </g>

  <!-- STAGE 3 -->
  <g transform="translate(470, 56)">
    <rect x="0" y="7" width="196" height="118" rx="12" fill="#050507" stroke="#27272a"/>
    <rect x="0" y="0" width="196" height="118" rx="12" fill="#16171d" stroke="#3f3f46" stroke-width="1.2"/>
    <text x="18" y="30" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="800" fill="#d4d4d8">STAGE 03</text>
    <text x="18" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="800" fill="#fafafa">Data &amp; AI APIs</text>
    <text x="18" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#a1a1aa">Neon Postgres, auth</text>
    <text x="18" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#a1a1aa">&amp; LLM agent pipelines</text>
  </g>

  <!-- STAGE 4 -->
  <g transform="translate(691, 56)">
    <rect x="0" y="7" width="199" height="118" rx="12" fill="#050507" stroke="#27272a"/>
    <rect x="0" y="0" width="199" height="118" rx="12" fill="#16171d" stroke="#52525b" stroke-width="1.2"/>
    <line x1="12" y1="1" x2="187" y2="1" stroke="#d4af37" stroke-width="1.5"/>
    <text x="18" y="30" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="800" fill="#eab308">STAGE 04</text>
    <text x="18" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="800" fill="#fafafa">Live Cloud Ship</text>
    <text x="18" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#a1a1aa">Private GitHub repo &amp;</text>
    <text x="18" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#a1a1aa">instant edge deployment</text>
  </g>
</svg>
