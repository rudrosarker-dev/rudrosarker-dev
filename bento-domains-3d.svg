<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="100%" height="350">
  <defs>
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151a"/>
      <stop offset="100%" stop-color="#0b0c0f"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="platEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e4e4e7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <style>
      .icon-float-1 { animation: f1 4s ease-in-out infinite; }
      .icon-float-2 { animation: f1 4.8s ease-in-out 0.6s infinite; }
      @keyframes f1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
    </style>
  </defs>
  <rect width="920" height="350" rx="16" fill="#09090b"/>
  
  <!-- Card at (12, 10) -->
  <rect x="12" y="18" width="440" height="152" rx="14" fill="#040406" stroke="#27272a" stroke-width="1"/>
  <rect x="12" y="10" width="440" height="152" rx="14" fill="url(#cardSurface)" stroke="#2e2e36" stroke-width="1.2"/>
  <line x1="32" y1="10" x2="272" y2="10" stroke="url(#goldEdge)" stroke-width="2"/>
  <g class="icon-float-1">
    
      <polygon points="62,33.0 88,46 62,59.0 36,46" fill="url(#goldTop)"/>
      <polygon points="36,46 62,59.0 62,83.0 36,70" fill="#854d0e"/>
      <polygon points="88,46 62,59.0 62,83.0 88,70" fill="#a16207"/>
    
  </g>
  <text x="106" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="800" fill="#fafafa">Websites &amp; Web Apps</text>
  <text x="106" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="600" fill="#eab308">Fast, modern &amp; mobile-friendly</text>
  <text x="36" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a1a1aa">I build clean, responsive websites and full-stack web apps</text>
  <text x="36" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a1a1aa">using TypeScript, React, Next.js, and Tailwind CSS.</text>

  
  <!-- Card at (468, 10) -->
  <rect x="468" y="18" width="440" height="152" rx="14" fill="#040406" stroke="#27272a" stroke-width="1"/>
  <rect x="468" y="10" width="440" height="152" rx="14" fill="url(#cardSurface)" stroke="#2e2e36" stroke-width="1.2"/>
  <line x1="488" y1="10" x2="728" y2="10" stroke="url(#platEdge)" stroke-width="2"/>
  <g class="icon-float-2">
    
      <polygon points="518,33.0 544,46 518,59.0 492,46" fill="#e4e4e7"/>
      <polygon points="492,46 518,59.0 518,83.0 492,70" fill="#52525b"/>
      <polygon points="544,46 518,59.0 518,83.0 544,70" fill="#71717a"/>
    
  </g>
  <text x="562" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="800" fill="#fafafa">Online Stores &amp; Platforms</text>
  <text x="562" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="600" fill="#d4d4d8">Complete e-commerce &amp; custom portals</text>
  <text x="492" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a1a1aa">From product pages and shopping carts to admin panels,</text>
  <text x="492" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a1a1aa">I create custom online shops and digital platforms.</text>

  
  <!-- Card at (12, 182) -->
  <rect x="12" y="190" width="440" height="152" rx="14" fill="#040406" stroke="#27272a" stroke-width="1"/>
  <rect x="12" y="182" width="440" height="152" rx="14" fill="url(#cardSurface)" stroke="#2e2e36" stroke-width="1.2"/>
  <line x1="32" y1="182" x2="272" y2="182" stroke="url(#platEdge)" stroke-width="2"/>
  <g class="icon-float-2">
    
      <polygon points="62,205.0 88,218 62,231.0 36,218" fill="#e4e4e7"/>
      <polygon points="36,218 62,231.0 62,255.0 36,242" fill="#52525b"/>
      <polygon points="88,218 62,231.0 62,255.0 88,242" fill="#71717a"/>
    
  </g>
  <text x="106" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="800" fill="#fafafa">AI-Powered Apps &amp; Agents</text>
  <text x="106" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="600" fill="#d4d4d8">Smart features built into the web</text>
  <text x="36" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a1a1aa">I use AI tools and APIs (like Google Gemini) to build</text>
  <text x="36" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a1a1aa">smart web apps, custom AI agents, and automated tools.</text>

  
  <!-- Card at (468, 182) -->
  <rect x="468" y="190" width="440" height="152" rx="14" fill="#040406" stroke="#27272a" stroke-width="1"/>
  <rect x="468" y="182" width="440" height="152" rx="14" fill="url(#cardSurface)" stroke="#2e2e36" stroke-width="1.2"/>
  <line x1="488" y1="182" x2="728" y2="182" stroke="url(#goldEdge)" stroke-width="2"/>
  <g class="icon-float-1">
    
      <polygon points="518,205.0 544,218 518,231.0 492,218" fill="url(#goldTop)"/>
      <polygon points="492,218 518,231.0 518,255.0 492,242" fill="#854d0e"/>
      <polygon points="544,218 518,231.0 518,255.0 544,242" fill="#a16207"/>
    
  </g>
  <text x="562" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="800" fill="#fafafa">Why My Projects Are Private</text>
  <text x="562" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="600" fill="#eab308">Keeping code &amp; ideas safe</text>
  <text x="492" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a1a1aa">I keep my main web apps and client projects in private</text>
  <text x="492" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a1a1aa">repositories so the source code stays secure.</text>

</svg>
