<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="100%" height="350">
  <defs>
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151a"/>
      <stop offset="100%" stop-color="#0b0c0f"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="platEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e4e4e7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <style>
      .icon-float-1 { animation: f1 4s ease-in-out infinite; }
      .icon-float-2 { animation: f1 4.8s ease-in-out 0.6s infinite; }
      @keyframes f1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
    </style>
  </defs>

  <rect width="920" height="350" rx="16" fill="#09090b"/>

  <!-- CARD 1: WEBSITES & WEB APPS -->
  <g transform="translate(12, 10)">
    <rect x="0" y="8" width="440" height="152" rx="14" fill="#040406" stroke="#27272a" stroke-width="1"/>
    <rect x="0" y="0" width="440" height="152" rx="14" fill="url(#cardSurface)" stroke="#2e2e36" stroke-width="1.2"/>
    <line x1="20" y1="0" x2="260" y2="0" stroke="url(#goldEdge)" stroke-width="2"/>

    <!-- Outer <g> holds position (24, 24), inner <g> animates smoothly -->
    <g transform="translate(24, 22)">
      <g class="icon-float-1">
        <polygon points="26,0 52,13 26,26 0,13" fill="url(#goldTop)"/>
        <polygon points="0,13 26,26 26,50 0,37" fill="#854d0e"/>
        <polygon points="52,13 26,26 26,50 52,37" fill="#a16207"/>
      </g>
    </g>

    <text x="94" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="800" fill="#fafafa">Websites &amp; Web Apps</text>
    <text x="94" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="600" fill="#eab308">Fast, modern &amp; mobile-friendly</text>
    <text x="24" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a1a1aa">I build clean, responsive websites and full-stack web apps</text>
    <text x="24" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a1a1aa">using TypeScript, React, Next.js, and Tailwind CSS.</text>
  </g>

  <!-- CARD 2: E-COMMERCE & ONLINE STORES -->
  <g transform="translate(468, 10)">
    <rect x="0" y="8" width="440" height="152" rx="14" fill="#040406" stroke="#27272a" stroke-width="1"/>
    <rect x="0" y="0" width="440" height="152" rx="14" fill="url(#cardSurface)" stroke="#2e2e36" stroke-width="1.2"/>
    <line x1="20" y1="0" x2="260" y2="0" stroke="url(#platEdge)" stroke-width="2"/>

    <g transform="translate(24, 22)">
      <g class="icon-float-2">
        <polygon points="26,0 52,13 26,26 0,13" fill="#e4e4e7"/>
        <polygon points="0,13 26,26 26,50 0,37" fill="#52525b"/>
        <polygon points="52,13 26,26 26,50 52,37" fill="#71717a"/>
      </g>
    </g>

    <text x="94" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="800" fill="#fafafa">Online Stores &amp; Platforms</text>
    <text x="94" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="600" fill="#d4d4d8">Complete e-commerce &amp; custom portals</text>
    <text x="24" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a1a1aa">From product pages and shopping carts to admin panels,</text>
    <text x="24" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a1a1aa">I create custom online shops and digital platforms.</text>
  </g>

  <!-- CARD 3: AI APPS & TOOLS -->
  <g transform="translate(12, 182)">
    <rect x="0" y="8" width="440" height="152" rx="14" fill="#040406" stroke="#27272a" stroke-width="1"/>
    <rect x="0" y="0" width="440" height="152" rx="14" fill="url(#cardSurface)" stroke="#2e2e36" stroke-width="1.2"/>
    <line x1="20" y1="0" x2="260" y2="0" stroke="url(#platEdge)" stroke-width="2"/>

    <g transform="translate(24, 22)">
      <g class="icon-float-2">
        <polygon points="26,0 52,13 26,26 0,13" fill="#e4e4e7"/>
        <polygon points="0,13 26,26 26,50 0,37" fill="#52525b"/>
        <polygon points="52,13 26,26 26,50 52,37" fill="#71717a"/>
      </g>
    </g>

    <text x="94" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="800" fill="#fafafa">AI-Powered Apps &amp; Agents</text>
    <text x="94" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="600" fill="#d4d4d8">Smart features built into the web</text>
    <text x="24" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a1a1aa">I use AI tools and APIs (like Google Gemini) to build</text>
    <text x="24" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a1a1aa">smart web apps, custom AI agents, and automated tools.</text>
  </g>

  <!-- CARD 4: PRIVATE REPOSITORIES -->
  <g transform="translate(468, 182)">
    <rect x="0" y="8" width="440" height="152" rx="14" fill="#040406" stroke="#27272a" stroke-width="1"/>
    <rect x="0" y="0" width="440" height="152" rx="14" fill="url(#cardSurface)" stroke="#2e2e36" stroke-width="1.2"/>
    <line x1="20" y1="0" x2="260" y2="0" stroke="url(#goldEdge)" stroke-width="2"/>

    <g transform="translate(24, 22)">
      <g class="icon-float-1">
        <polygon points="26,0 52,13 26,26 0,13" fill="url(#goldTop)"/>
        <polygon points="0,13 26,26 26,50 0,37" fill="#854d0e"/>
        <polygon points="52,13 26,26 26,50 52,37" fill="#a16207"/>
      </g>
    </g>

    <text x="94" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="800" fill="#fafafa">Why My Projects Are Private</text>
    <text x="94" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="600" fill="#eab308">Keeping code &amp; ideas safe</text>
    <text x="24" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a1a1aa">I keep my main web apps and client projects in private</text>
    <text x="24" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5" fill="#a1a1aa">repositories so the source code stays secure.</text>
  </g>
</svg>
