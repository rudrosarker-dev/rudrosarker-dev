<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="100%" height="350">
  <defs>
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151a"/>
      <stop offset="100%" stop-color="#0b0c0f"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="platEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e4e4e7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <style>
      .icon-float-1 { animation: f1 4s ease-in-out infinite; }
      .icon-float-2 { animation: f1 4.8s ease-in-out infinite; }
      @keyframes f1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <rect width="920" height="350" rx="16" fill="#09090b"/>

  <!-- ================= CARD 1: CUSTOM WEB APPS (TOP LEFT) ================= -->
  <g transform="translate(12, 10)">
    <!-- 3D Extruded Bottom Shadow Base -->
    <rect x="0" y="8" width="440" height="152" rx="14" fill="#050507" stroke="#27272a" stroke-width="1"/>
    <!-- Main Card Face -->
    <rect x="0" y="0" width="440" height="152" rx="14" fill="url(#cardSurface)" stroke="#2e2e36" stroke-width="1.2"/>
    <line x1="20" y1="0" x2="260" y2="0" stroke="url(#goldEdge)" stroke-width="2"/>

    <!-- 3D Isometric Icon Block -->
    <g class="icon-float-1" transform="translate(26, 26)">
      <polygon points="28,0 56,14 28,28 0,14" fill="url(#goldTop)"/>
      <polygon points="0,14 28,28 28,54 0,40" fill="#854d0e"/>
      <polygon points="56,14 28,28 28,54 56,40" fill="#a16207"/>
    </g>

    <text x="102" y="38" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#eab308" letter-spacing="1.2">01 // WEB ARCHITECTURE</text>
    <text x="102" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="800" fill="#fafafa">Custom Websites &amp; Web Apps</text>
    <text x="26" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#a1a1aa">High-speed, responsive full-stack platforms engineered with</text>
    <text x="26" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#a1a1aa">TypeScript, React, Next.js, and modern interactive UI/UX.</text>
  </g>

  <!-- ================= CARD 2: DIGITAL COMMERCE (TOP RIGHT) ================= -->
  <g transform="translate(468, 10)">
    <rect x="0" y="8" width="440" height="152" rx="14" fill="#050507" stroke="#27272a" stroke-width="1"/>
    <rect x="0" y="0" width="440" height="152" rx="14" fill="url(#cardSurface)" stroke="#2e2e36" stroke-width="1.2"/>
    <line x1="20" y1="0" x2="260" y2="0" stroke="url(#platEdge)" stroke-width="2"/>

    <g class="icon-float-2" transform="translate(26, 26)">
      <polygon points="28,0 56,14 28,28 0,14" fill="#e4e4e7"/>
      <polygon points="0,14 28,28 28,54 0,40" fill="#52525b"/>
      <polygon points="56,14 28,28 28,54 56,40" fill="#71717a"/>
    </g>

    <text x="102" y="38" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#d4d4d8" letter-spacing="1.2">02 // COMMERCE &amp; SAAS SYSTEMS</text>
    <text x="102" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="800" fill="#fafafa">E-Commerce &amp; Digital Platforms</text>
    <text x="26" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#a1a1aa">End-to-end online storefronts, digital publishing portals,</text>
    <text x="26" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#a1a1aa">catalog systems, cart workflows, and admin dashboards.</text>
  </g>

  <!-- ================= CARD 3: AI AGENTS & AUTOMATION (BOTTOM LEFT) ================= -->
  <g transform="translate(12, 182)">
    <rect x="0" y="8" width="440" height="152" rx="14" fill="#050507" stroke="#27272a" stroke-width="1"/>
    <rect x="0" y="0" width="440" height="152" rx="14" fill="url(#cardSurface)" stroke="#2e2e36" stroke-width="1.2"/>
    <line x1="20" y1="0" x2="260" y2="0" stroke="url(#platEdge)" stroke-width="2"/>

    <g class="icon-float-2" transform="translate(26, 26)">
      <polygon points="28,0 56,14 28,28 0,14" fill="#e4e4e7"/>
      <polygon points="0,14 28,28 28,54 0,40" fill="#52525b"/>
      <polygon points="56,14 28,28 28,54 56,40" fill="#71717a"/>
    </g>

    <text x="102" y="38" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#d4d4d8" letter-spacing="1.2">03 // INTELLIGENT AUTOMATION</text>
    <text x="102" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="800" fill="#fafafa">AI Agents &amp; Smart Workflows</text>
    <text x="26" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#a1a1aa">Custom LLM integrations, AI-assisted web applications,</text>
    <text x="26" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#a1a1aa">automated task pipelines, and smart conversational tools.</text>
  </g>

  <!-- ================= CARD 4: PRIVATE PRODUCTION LAB (BOTTOM RIGHT) ================= -->
  <g transform="translate(468, 182)">
    <rect x="0" y="8" width="440" height="152" rx="14" fill="#050507" stroke="#27272a" stroke-width="1"/>
    <rect x="0" y="0" width="440" height="152" rx="14" fill="url(#cardSurface)" stroke="#2e2e36" stroke-width="1.2"/>
    <line x1="20" y1="0" x2="260" y2="0" stroke="url(#goldEdge)" stroke-width="2"/>

    <g class="icon-float-1" transform="translate(26, 26)">
      <polygon points="28,0 56,14 28,28 0,14" fill="url(#goldTop)"/>
      <polygon points="0,14 28,28 28,54 0,40" fill="#854d0e"/>
      <polygon points="56,14 28,28 28,54 56,40" fill="#a16207"/>
    </g>

    <text x="102" y="38" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#eab308" letter-spacing="1.2">04 // IP &amp; CLIENT CONFIDENTIALITY</text>
    <text x="102" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="800" fill="#fafafa">Private Production Vault</text>
    <text x="26" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#a1a1aa">Active commercial builds and proprietary platforms are</text>
    <text x="26" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" fill="#a1a1aa">maintained in private repositories to protect project IP.</text>
  </g>
</svg>
