<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 295" width="100%" height="295">
  <defs>
    <linearGradient id="deckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c0f"/>
      <stop offset="100%" stop-color="#131419"/>
    </linearGradient>
    <linearGradient id="keyTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22232a"/>
      <stop offset="100%" stop-color="#15161b"/>
    </linearGradient>
    <style>
      .wave-1 { animation: waveKey 4.2s ease-in-out infinite; }
      .wave-2 { animation: waveKey 4.2s ease-in-out 0.7s infinite; }
      .wave-3 { animation: waveKey 4.2s ease-in-out 1.4s infinite; }
      @keyframes waveKey {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
    </style>
  </defs>

  <rect x="2" y="2" width="916" height="291" rx="16" fill="url(#deckBg)" stroke="#27272a" stroke-width="1.5"/>

  <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="800" fill="#f4f4f5">
    Languages, Frameworks &amp; AI Tools I Work With
  </text>

  <!-- ROW 1 (Outer <g> holds translate(32, 58), inner <g> has class="wave-1") -->
  <g transform="translate(32, 58)">
    <g class="wave-1">
      <g transform="translate(0, 0)">
        <rect x="0" y="7" width="198" height="54" rx="10" fill="#050507" stroke="#27272a"/>
        <rect x="0" y="0" width="198" height="54" rx="10" fill="url(#keyTop)" stroke="#52525b" stroke-width="1.2"/>
        <line x1="12" y1="1" x2="186" y2="1" stroke="#d4af37" stroke-width="1.5"/>
        <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#eab308" font-weight="700">Main Language</text>
        <text x="18" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">TypeScript</text>
      </g>
      <g transform="translate(218, 0)">
        <rect x="0" y="7" width="198" height="54" rx="10" fill="#050507" stroke="#27272a"/>
        <rect x="0" y="0" width="198" height="54" rx="10" fill="url(#keyTop)" stroke="#3f3f46" stroke-width="1.2"/>
        <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#a1a1aa" font-weight="600">Frontend &amp; Web Apps</text>
        <text x="18" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">React &amp; Next.js</text>
      </g>
      <g transform="translate(436, 0)">
        <rect x="0" y="7" width="198" height="54" rx="10" fill="#050507" stroke="#27272a"/>
        <rect x="0" y="0" width="198" height="54" rx="10" fill="url(#keyTop)" stroke="#3f3f46" stroke-width="1.2"/>
        <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#a1a1aa" font-weight="600">Styling &amp; Design</text>
        <text x="18" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">Tailwind CSS</text>
      </g>
      <g transform="translate(654, 0)">
        <rect x="0" y="7" width="202" height="54" rx="10" fill="#050507" stroke="#27272a"/>
        <rect x="0" y="0" width="202" height="54" rx="10" fill="url(#keyTop)" stroke="#3f3f46" stroke-width="1.2"/>
        <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#a1a1aa" font-weight="600">Core Web</text>
        <text x="18" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">JavaScript &amp; HTML/CSS</text>
      </g>
    </g>
  </g>

