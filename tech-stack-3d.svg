    <rect x="250" y="58" width="198" height="54" rx="10" fill="url(#keyTop)" stroke="#3f3f46" stroke-width="1.2"/>
    
    <text x="268" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#a1a1aa" font-weight="600">Frontend &amp; Web Apps</text>
    <text x="268" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">React &amp; Next.js</text>

    
    <rect x="468" y="65" width="198" height="54" rx="10" fill="#050507" stroke="#27272a"/>
