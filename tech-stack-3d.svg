        <rect x="0" y="7" width="275" height="54" rx="10" fill="#050507" stroke="#27272a"/>
        <rect x="0" y="0" width="275" height="54" rx="10" fill="url(#keyTop)" stroke="#52525b" stroke-width="1.2"/>
        <line x1="12" y1="1" x2="263" y2="1" stroke="#d4af37" stroke-width="1.5"/>
        <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#eab308" font-weight="700">AI Models &amp; APIs</text>
        <text x="18" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">Google AI Studio &amp; Gemini</text>
      </g>
      <g transform="translate(292, 0)">
        <rect x="0" y="7" width="275" height="54" rx="10" fill="#050507" stroke="#27272a"/>
        <rect x="0" y="0" width="275" height="54" rx="10" fill="url(#keyTop)" stroke="#3f3f46" stroke-width="1.2"/>
        <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#a1a1aa" font-weight="600">Smart Automation</text>
        <text x="18" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">Custom AI Agents &amp; Bots</text>
      </g>
      <g transform="translate(584, 0)">
        <rect x="0" y="7" width="272" height="54" rx="10" fill="#050507" stroke="#27272a"/>
        <rect x="0" y="0" width="272" height="54" rx="10" fill="url(#keyTop)" stroke="#52525b" stroke-width="1.2"/>
        <line x1="12" y1="1" x2="260" y2="1" stroke="#d4af37" stroke-width="1.5"/>
        <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#eab308" font-weight="700">Daily Workflow</text>
        <text x="18" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">AI-Assisted Web Building</text>
      </g>
    </g>
  </g>
</svg>
