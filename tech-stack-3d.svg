<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 290" width="100%" height="290">
  <defs>
    <linearGradient id="deckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c0f"/>
      <stop offset="100%" stop-color="#131419"/>
    </linearGradient>
    <linearGradient id="keyTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22232a"/>
      <stop offset="100%" stop-color="#16171c"/>
    </linearGradient>
    <style>
      .row-1 { animation: waveRow 4.5s ease-in-out infinite; }
      .row-2 { animation: waveRow 4.5s ease-in-out 0.8s infinite; }
      .row-3 { animation: waveRow 4.5s ease-in-out 1.6s infinite; }
      @keyframes waveRow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
    </style>
  </defs>

  <rect x="2" y="2" width="916" height="286" rx="16" fill="url(#deckBg)" stroke="#27272a" stroke-width="1.5"/>

  <text x="36" y="38" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#eab308" letter-spacing="1.5">
    3D TACTILE ENGINEERING DECK  //  CORE LANGUAGES, CLOUD &amp; AI WORKFLOW
  </text>

  <!-- ROW 1: LANGUAGES & FRONTEND -->
  <g class="row-1" transform="translate(32, 58)">
    <!-- Key 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="7" width="198" height="54" rx="10" fill="#050507" stroke="#27272a"/>
      <rect x="0" y="0" width="198" height="54" rx="10" fill="url(#keyTop)" stroke="#52525b" stroke-width="1.2"/>
      <line x1="12" y1="1" x2="186" y2="1" stroke="#d4af37" stroke-width="1.5"/>
      <text x="20" y="24" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#eab308" font-weight="700">PRIMARY LANGUAGE</text>
      <text x="20" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">TypeScript (98%)</text>
    </g>
    <!-- Key 2 -->
    <g transform="translate(218, 0)">
      <rect x="0" y="7" width="198" height="54" rx="10" fill="#050507" stroke="#27272a"/>
      <rect x="0" y="0" width="198" height="54" rx="10" fill="url(#keyTop)" stroke="#3f3f46" stroke-width="1.2"/>
      <text x="20" y="24" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#a1a1aa" font-weight="700">FRONTEND UI</text>
      <text x="20" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">React.js &amp; Next.js</text>
    </g>
    <!-- Key 3 -->
    <g transform="translate(436, 0)">
      <rect x="0" y="7" width="198" height="54" rx="10" fill="#050507" stroke="#27272a"/>
      <rect x="0" y="0" width="198" height="54" rx="10" fill="url(#keyTop)" stroke="#3f3f46" stroke-width="1.2"/>
      <text x="20" y="24" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#a1a1aa" font-weight="700">DESIGN SYSTEM</text>
      <text x="20" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">Tailwind CSS • UI</text>
    </g>
    <!-- Key 4 -->
    <g transform="translate(654, 0)">
      <rect x="0" y="7" width="202" height="54" rx="10" fill="#050507" stroke="#27272a"/>
      <rect x="0" y="0" width="202" height="54" rx="10" fill="url(#keyTop)" stroke="#3f3f46" stroke-width="1.2"/>
      <text x="20" y="24" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#a1a1aa" font-weight="700">WEB STANDARDS</text>
      <text x="20" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">JavaScript • HTML5</text>
    </g>
  </g>

  <!-- ROW 2: BACKEND, DATABASE & CLOUD -->
  <g class="row-2" transform="translate(32, 134)">
    <g transform="translate(0, 0)">
      <rect x="0" y="7" width="198" height="54" rx="10" fill="#050507" stroke="#27272a"/>
      <rect x="0" y="0" width="198" height="54" rx="10" fill="url(#keyTop)" stroke="#3f3f46" stroke-width="1.2"/>
      <text x="20" y="24" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#a1a1aa" font-weight="700">SERVER RUNTIME</text>
      <text x="20" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">Node.js &amp; Python</text>
    </g>
    <g transform="translate(218, 0)">
      <rect x="0" y="7" width="198" height="54" rx="10" fill="#050507" stroke="#27272a"/>
      <rect x="0" y="0" width="198" height="54" rx="10" fill="url(#keyTop)" stroke="#52525b" stroke-width="1.2"/>
      <line x1="12" y1="1" x2="186" y2="1" stroke="#d4af37" stroke-width="1.5"/>
      <text x="20" y="24" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#eab308" font-weight="700">CLOUD DATABASE</text>
      <text x="20" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">Neon PostgreSQL</text>
    </g>
    <g transform="translate(436, 0)">
      <rect x="0" y="7" width="198" height="54" rx="10" fill="#050507" stroke="#27272a"/>
      <rect x="0" y="0" width="198" height="54" rx="10" fill="url(#keyTop)" stroke="#3f3f46" stroke-width="1.2"/>
      <text x="20" y="24" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#a1a1aa" font-weight="700">ORM &amp; DATA LAYER</text>
      <text x="20" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">Prisma • REST APIs</text>
    </g>
    <g transform="translate(654, 0)">
      <rect x="0" y="7" width="202" height="54" rx="10" fill="#050507" stroke="#27272a"/>
      <rect x="0" y="0" width="202" height="54" rx="10" fill="url(#keyTop)" stroke="#3f3f46" stroke-width="1.2"/>
      <text x="20" y="24" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#a1a1aa" font-weight="700">CLOUD DEPLOYMENT</text>
      <text x="20" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">Vercel • GitHub CI</text>
    </g>
  </g>

  <!-- ROW 3: AI & MODERN ENGINEERING -->
  <g class="row-3" transform="translate(32, 210)">
    <g transform="translate(0, 0)">
      <rect x="0" y="7" width="275" height="52" rx="10" fill="#050507" stroke="#27272a"/>
      <rect x="0" y="0" width="275" height="52" rx="10" fill="url(#keyTop)" stroke="#52525b" stroke-width="1.2"/>
      <line x1="12" y1="1" x2="263" y2="1" stroke="#d4af37" stroke-width="1.5"/>
      <text x="20" y="22" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#eab308" font-weight="700">AI MODEL STUDIO</text>
      <text x="20" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">Google AI Studio • Gemini</text>
    </g>
    <g transform="translate(292, 0)">
      <rect x="0" y="7" width="275" height="52" rx="10" fill="#050507" stroke="#27272a"/>
      <rect x="0" y="0" width="275" height="52" rx="10" fill="url(#keyTop)" stroke="#3f3f46" stroke-width="1.2"/>
      <text x="20" y="22" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#a1a1aa" font-weight="700">AGENTIC WORKFLOWS</text>
      <text x="20" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">LLM Agents &amp; Prompt Eng.</text>
    </g>
    <g transform="translate(584, 0)">
      <rect x="0" y="7" width="272" height="52" rx="10" fill="#050507" stroke="#27272a"/>
      <rect x="0" y="0" width="272" height="52" rx="10" fill="url(#keyTop)" stroke="#52525b" stroke-width="1.2"/>
      <line x1="12" y1="1" x2="260" y2="1" stroke="#d4af37" stroke-width="1.5"/>
      <text x="20" y="22" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#eab308" font-weight="700">RAPID DELIVERY</text>
      <text x="20" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">AI-Accelerated Shipping</text>
    </g>
  </g>
</svg>
