    <rect x="250" y="143" width="198" height="54" rx="10" fill="#050507" stroke="#27272a"/>
    <rect x="250" y="136" width="198" height="54" rx="10" fill="url(#keyTop)" stroke="#52525b" stroke-width="1.2"/>
