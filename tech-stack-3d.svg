  <g transform="translate(32, 136)">
    <g class="wave-2">
      <g transform="translate(0, 0)">
        <rect x="0" y="7" width="198" height="54" rx="10" fill="#050507" stroke="#27272a"/>
        <rect x="0" y="0" width="198" height="54" rx="10" fill="url(#keyTop)" stroke="#3f3f46" stroke-width="1.2"/>
        <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#a1a1aa" font-weight="600">Backend</text>
        <text x="18" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">Node.js &amp; Python</text>
      </g>
      <g transform="translate(218, 0)">
        <rect x="0" y="7" width="198" height="54" rx="10" fill="#050507" stroke="#27272a"/>
        <rect x="0" y="0" width="198" height="54" rx="10" fill="url(#keyTop)" stroke="#52525b" stroke-width="1.2"/>
        <line x1="12" y1="1" x2="186" y2="1" stroke="#d4af37" stroke-width="1.5"/>
        <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#eab308" font-weight="700">Database</text>
        <text x="18" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">Neon PostgreSQL</text>
      </g>
      <g transform="translate(436, 0)">
        <rect x="0" y="7" width="198" height="54" rx="10" fill="#050507" stroke="#27272a"/>
        <rect x="0" y="0" width="198" height="54" rx="10" fill="url(#keyTop)" stroke="#3f3f46" stroke-width="1.2"/>
        <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#a1a1aa" font-weight="600">Data &amp; APIs</text>
        <text x="18" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">Prisma &amp; REST APIs</text>
      </g>
      <g transform="translate(654, 0)">
        <rect x="0" y="7" width="202" height="54" rx="10" fill="#050507" stroke="#27272a"/>
        <rect x="0" y="0" width="202" height="54" rx="10" fill="url(#keyTop)" stroke="#3f3f46" stroke-width="1.2"/>
        <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#a1a1aa" font-weight="600">Hosting &amp; Code</text>
        <text x="18" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">Vercel, Git &amp; GitHub</text>
      </g>
    </g>
