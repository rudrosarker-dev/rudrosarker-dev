    <text x="486" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#a1a1aa" font-weight="600">Data &amp; APIs</text>
    <text x="486" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">Prisma &amp; REST APIs</text>

    
    <rect x="686" y="143" width="202" height="54" rx="10" fill="#050507" stroke="#27272a"/>
    <rect x="686" y="136" width="202" height="54" rx="10" fill="url(#keyTop)" stroke="#3f3f46" stroke-width="1.2"/>
    
