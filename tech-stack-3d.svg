    <text x="342" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#a1a1aa" font-weight="600">Smart Automation</text>
    <text x="342" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" fill="#fafafa" font-weight="800">Custom AI Agents &amp; Bots</text>

    
    <rect x="616" y="221" width="272" height="54" rx="10" fill="#050507" stroke="#27272a"/>
