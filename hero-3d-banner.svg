<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cyanPurp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .grid-line { stroke: rgba(56, 189, 248, 0.12); stroke-width: 1; }
      .float-cube-1 { animation: float1 4s ease-in-out infinite; transform-origin: center; }
      .float-cube-2 { animation: float2 5s ease-in-out infinite; transform-origin: center; }
      .float-cube-3 { animation: float3 3.5s ease-in-out infinite; transform-origin: center; }
      .orbit-ring { animation: pulseRing 3s ease-in-out infinite; transform-origin: 730px 140px; }
      .title-text { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; letter-spacing: 2px; }
      .sub-text { font-family: 'Courier New', monospace; font-weight: 600; font-size: 16px; fill: #38bdf8; }
      .badge-box { fill: rgba(15, 23, 42, 0.75); stroke: #38bdf8; stroke-width: 1.5; rx: 8; }
      .scanline { animation: scan 6s linear infinite; }
      @keyframes float1 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-16px); } }
      @keyframes float2 { 0%, 100% { transform: translateY(0px) scale(1); } 50% { transform: translateY(14px) scale(1.04); } }
      @keyframes float3 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
      @keyframes pulseRing { 0%, 100% { opacity: 0.4; transform: scale(0.96); } 50% { opacity: 0.95; transform: scale(1.05); } }
      @keyframes scan { 0% { transform: translateY(-280px); } 100% { transform: translateY(280px); } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" rx="16" fill="url(#bgGrad)" stroke="url(#cyanPurp)" stroke-width="2"/>

  <!-- 3D Perspective Grid Floor -->
  <g>
    <line x1="0" y1="220" x2="900" y2="220" class="grid-line"/>
    <line x1="0" y1="245" x2="900" y2="245" class="grid-line"/>
    <line x1="0" y1="268" x2="900" y2="268" class="grid-line"/>
    <line x1="150" y1="190" x2="50" y2="280" class="grid-line"/>
    <line x1="300" y1="190" x2="220" y2="280" class="grid-line"/>
    <line x1="450" y1="190" x2="450" y2="280" class="grid-line"/>
    <line x1="600" y1="190" x2="680" y2="280" class="grid-line"/>
    <line x1="750" y1="190" x2="850" y2="280" class="grid-line"/>
  </g>

  <!-- Left Content: Name & AI Role -->
  <g transform="translate(48, 58)">
    <rect x="0" y="0" width="240" height="28" class="badge-box"/>
    <circle cx="16" cy="14" r="5" fill="#10b981" filter="url(#glow)"/>
    <text x="30" y="19" font-family="monospace" font-size="12" fill="#e2e8f0" font-weight="bold">AI-NATIVE DEV LAB // ONLINE</text>

    <text x="0" y="78" class="title-text" filter="url(#glow)">RUDRO SARKER</text>
    <text x="0" y="110" class="sub-text">&gt; AI-First Web &amp; App Developer_</text>
    <text x="0" y="138" font-family="Segoe UI, sans-serif" font-size="14" fill="#94a3b8">
      Architecting modern websites, full-stack web apps &amp; intelligent AI systems
    </text>

    <!-- 3D Pill Tags -->
    <g transform="translate(0, 158)">
      <rect x="0" y="0" width="118" height="28" rx="6" fill="#1e293b" stroke="#00f2fe" stroke-width="1"/>
      <text x="16" y="18" font-family="monospace" font-size="12" fill="#00f2fe" font-weight="bold">⚡ TypeScript</text>

      <rect x="130" y="0" width="128" height="28" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
      <text x="144" y="18" font-family="monospace" font-size="12" fill="#d8b4fe" font-weight="bold">🤖 AI Workflow</text>

      <rect x="270" y="0" width="134" height="28" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
      <text x="284" y="18" font-family="monospace" font-size="12" fill="#f472b6" font-weight="bold">🚀 Full-Stack</text>
    </g>
  </g>

  <!-- Right Content: 3D Isometric Floating Cyber Cubes & Holographic Rings -->
  <g class="orbit-ring">
    <ellipse cx="730" cy="150" rx="115" ry="45" fill="none" stroke="url(#cyanPurp)" stroke-width="2" stroke-dasharray="10 6"/>
    <ellipse cx="730" cy="150" rx="85" ry="30" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- Main Center 3D Isometric Cube -->
  <g class="float-cube-1" filter="url(#glow)">
    <!-- Top Face -->
    <polygon points="730,65 790,98 730,131 670,98" fill="url(#cubeTop)" stroke="#e0f2fe" stroke-width="1.2"/>
    <!-- Left Face -->
    <polygon points="670,98 730,131 730,198 670,165" fill="url(#cubeLeft)" stroke="#818cf8" stroke-width="1.2"/>
    <!-- Right Face -->
    <polygon points="790,98 730,131 730,198 790,165" fill="url(#cubeRight)" stroke="#c084fc" stroke-width="1.2"/>
    <text x="712" y="104" font-family="monospace" font-weight="bold" font-size="16" fill="#090d16">AI</text>
  </g>

  <!-- Satellite 3D Cube Left -->
  <g class="float-cube-2">
    <polygon points="625,145 655,162 625,179 595,162" fill="url(#cubeTop)"/>
    <polygon points="595,162 625,179 625,212 595,195" fill="url(#cubeLeft)"/>
    <polygon points="655,162 625,179 625,212 655,195" fill="url(#cubeRight)"/>
  </g>

  <!-- Satellite 3D Cube Right -->
  <g class="float-cube-3">
    <polygon points="830,55 856,70 830,85 804,70" fill="url(#cubeTop)"/>
    <polygon points="804,70 830,85 830,115 804,100" fill="url(#cubeLeft)"/>
    <polygon points="856,70 830,85 830,115 856,100" fill="url(#cubeRight)"/>
  </g>

  <!-- Subtle Hologram Scanline -->
  <rect class="scanline" x="0" y="0" width="900" height="4" fill="url(#cyanPurp)" opacity="0.25"/>
</svg>
