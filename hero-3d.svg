<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="340">
  <defs>
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="55%" stop-color="#101115"/>
      <stop offset="100%" stop-color="#16181f"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.4"/>
      <stop offset="35%" stop-color="#d4af37" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="platinumText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <linearGradient id="isoTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272f"/>
      <stop offset="100%" stop-color="#18181c"/>
    </linearGradient>
    <linearGradient id="isoLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181c"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="isoRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222228"/>
      <stop offset="100%" stop-color="#0e0e11"/>
    </linearGradient>
    <linearGradient id="goldCubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="goldCubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="goldCubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="75%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#78350f" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <pattern id="archGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <style>
      .layer-base { animation: hoverBase 6s ease-in-out infinite; }
      .layer-mid  { animation: hoverMid 4.8s ease-in-out infinite; }
      .layer-top  { animation: hoverTop 3.8s ease-in-out infinite; }
      .sat-left   { animation: satFloatL 4.4s ease-in-out infinite; }
      .sat-right  { animation: satFloatR 3.6s ease-in-out infinite; }
      .pulse-dot  { animation: pulseDot 2.2s ease-in-out infinite; }
      .beam-line  { stroke-dasharray: 8 6; animation: dashFlow 3s linear infinite; }
      @keyframes hoverBase { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
      @keyframes hoverMid  { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-11px); } }
      @keyframes hoverTop  { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-18px); } }
      @keyframes satFloatL { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
      @keyframes satFloatR { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
      @keyframes pulseDot  { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes dashFlow  { to { stroke-dashoffset: -28; } }
    </style>
  </defs>

  <rect x="2" y="2" width="916" height="336" rx="18" fill="url(#obsidianBg)" stroke="#27272a" stroke-width="1.5"/>
  <rect x="2" y="2" width="916" height="336" rx="18" fill="url(#archGrid)"/>
  <rect x="2" y="2" width="916" height="336" rx="18" fill="url(#ambientGlow)"/>
  <line x1="60" y1="2" x2="860" y2="2" stroke="url(#goldRim)" stroke-width="2"/>

  <!-- Status Pill (Absolute Coordinates) -->
  <rect x="44" y="45" width="335" height="30" rx="15" fill="#050507"/>
  <rect x="44" y="42" width="335" height="30" rx="15" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <circle cx="62" cy="57" r="4.5" fill="#10b981" class="pulse-dot"/>
  <text x="76" y="61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="600" fill="#e4e4e7">Open to freelance &amp; web projects • Rajshahi, BD</text>

  <!-- 3D Extruded Main Name -->
  <text x="46" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="42" font-weight="800" fill="#000000" letter-spacing="0.5">Hi, I'm Rudro Sarker</text>
  <text x="44" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="42" font-weight="800" fill="url(#platinumText)" letter-spacing="0.5">Hi, I'm Rudro Sarker</text>

  <!-- Subtitle & Bio -->
  <text x="44" y="157" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="700" fill="#eab308">
    Web &amp; App Developer • Building with TypeScript, Next.js &amp; AI
  </text>
  <text x="44" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#a1a1aa">
    I build websites, online stores, and web apps using AI-assisted coding
  </text>
  <text x="44" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#a1a1aa">
    and modern web tools. I love turning ideas into fast, working products.
  </text>

  <!-- 3D Tactile Keycap Tags (Absolute Coordinates) -->
  <rect x="44" y="245" width="138" height="36" rx="8" fill="#050507" stroke="#27272a" stroke-width="1"/>
  <rect x="44" y="240" width="138" height="36" rx="8" fill="#18181c" stroke="#52525b" stroke-width="1"/>
  <line x1="52" y1="241" x2="174" y2="241" stroke="#d4af37" stroke-width="1.2"/>
  <text x="113" y="263" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="700" fill="#f4f4f5">Websites &amp; Apps</text>

  <rect x="194" y="245" width="142" height="36" rx="8" fill="#050507" stroke="#27272a" stroke-width="1"/>
  <rect x="194" y="240" width="142" height="36" rx="8" fill="#18181c" stroke="#52525b" stroke-width="1"/>
  <line x1="202" y1="241" x2="328" y2="241" stroke="#a1a1aa" stroke-width="1.2"/>
  <text x="265" y="263" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="700" fill="#e4e4e7">TypeScript • React</text>

  <rect x="348" y="245" width="140" height="36" rx="8" fill="#050507" stroke="#27272a" stroke-width="1"/>
  <rect x="348" y="240" width="140" height="36" rx="8" fill="#18181c" stroke="#52525b" stroke-width="1"/>
  <line x1="356" y1="241" x2="480" y2="241" stroke="#d4af37" stroke-width="1.2"/>
  <text x="418" y="263" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5" font-weight="700" fill="#fde68a">AI-Powered Code</text>

  <!-- Right Column 3D Isometric Monolith -->
  <ellipse cx="705" cy="192" rx="150" ry="65" fill="none" stroke="#3f3f46" stroke-width="1" stroke-dasharray="6 6"/>
  <ellipse cx="705" cy="192" rx="118" ry="50" fill="none" stroke="url(#goldRim)" stroke-width="1.5"/>

  <g class="layer-base" filter="url(#softShadow)">
    <polygon points="705,162 830,225 705,288 580,225" fill="url(#isoTop)" stroke="#52525b" stroke-width="1.2"/>
    <polygon points="705,174 806,225 705,276 604,225" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.6" class="beam-line"/>
    <polygon points="580,225 705,288 705,310 580,247" fill="url(#isoLeft)" stroke="#27272a" stroke-width="1"/>
    <polygon points="830,225 705,288 705,310 830,247" fill="url(#isoRight)" stroke="#3f3f46" stroke-width="1"/>
  </g>

  <g class="layer-mid" filter="url(#softShadow)">
    <polygon points="705,115 802,164 705,213 608,164" fill="#18181c" stroke="#a1a1aa" stroke-width="1.2"/>
    <polygon points="608,164 705,213 705,228 608,179" fill="#0f0f12" stroke="#3f3f46" stroke-width="1"/>
    <polygon points="802,164 705,213 705,228 802,179" fill="#27272f" stroke="#52525b" stroke-width="1"/>
    <polygon points="705,127 778,164 705,201 632,164" fill="#09090b" stroke="#d4af37" stroke-width="0.9" stroke-opacity="0.6"/>
    <line x1="668" y1="146" x2="742" y2="183" stroke="#3f3f46" stroke-width="1"/>
    <line x1="742" y1="146" x2="668" y2="183" stroke="#3f3f46" stroke-width="1"/>
  </g>

  <g class="layer-top" filter="url(#softShadow)">
    <polygon points="705,52 755,77 705,102 655,77" fill="url(#goldCubeTop)" stroke="#fef9c3" stroke-width="1.3"/>
    <polygon points="655,77 705,102 705,158 655,133" fill="url(#goldCubeLeft)" stroke="#ca8a04" stroke-width="1.2"/>
    <polygon points="755,77 705,102 705,158 755,133" fill="url(#goldCubeRight)" stroke="#fde047" stroke-width="1.2"/>
    <polygon points="705,64 733,77 705,90 677,77" fill="#09090b" stroke="#fde047" stroke-width="0.8"/>
  </g>

  <g class="sat-left" filter="url(#softShadow)">
    <polygon points="568,112 594,125 568,138 542,125" fill="#27272f" stroke="#d4af37" stroke-width="1"/>
    <polygon points="542,125 568,138 568,166 542,153" fill="#141418" stroke="#3f3f46" stroke-width="1"/>
    <polygon points="594,125 568,138 568,166 594,153" fill="#1f1f26" stroke="#52525b" stroke-width="1"/>
  </g>

  <g class="sat-right" filter="url(#softShadow)">
    <polygon points="835,96 861,109 835,122 809,109" fill="#27272f" stroke="#e4e4e7" stroke-width="1"/>
    <polygon points="809,109 835,122 835,150 809,137" fill="#141418" stroke="#3f3f46" stroke-width="1"/>
    <polygon points="861,109 835,122 835,150 861,137" fill="#1f1f26" stroke="#52525b" stroke-width="1"/>
  </g>
</svg>
